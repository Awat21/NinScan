name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/NinScan.Core.Tests -c Release

      - name: Build driver
        run: dotnet build src/NinScan.Driver -c Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/NinScan | Out-Null
          Copy-Item src/NinScan.Driver/bin/Release/net48/* artifacts/NinScan -Recurse
          Copy-Item docs/INSTALL.md artifacts/NinScan/

      - uses: actions/upload-artifact@v4
        with:
          name: NinScan-driver
          path: artifacts/NinScan
